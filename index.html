<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa Municipal Base</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="assets/styles/base.css" />
    <link rel="stylesheet" href="assets/styles/layout.css" />
    <link rel="stylesheet" href="assets/styles/components.css" />
    <link rel="stylesheet" href="assets/styles/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <header id="app-header" class="app-header"></header>

      <main class="app-main">
        <section class="map-wrap">
          <div id="map" class="map"></div>
          <div id="right-panels" class="right-panels">
            <aside id="category-panel" class="floating-box category-panel"></aside>
            <aside id="legend-panel" class="floating-box legend-panel"></aside>
          </div>
          <aside id="left-panel" class="floating-box detail-panel"></aside>
        </section>
      </main>

      <footer id="app-footer" class="app-footer"></footer>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="src/core/app.js"></script>
  </body>
</html>
