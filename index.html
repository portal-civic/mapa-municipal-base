<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa Municipal Base</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="assets/styles/base.css" />
    <link rel="stylesheet" href="assets/styles/layout.css" />
    <link rel="stylesheet" href="assets/styles/components.css" />
    <link rel="stylesheet" href="assets/styles/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <header id="app-header" class="app-header"></header>

      <main class="app-main">
        <aside id="left-panel" class="panel panel-left"></aside>

        <section class="map-wrap">
          <div id="map" class="map"></div>

        <aside id="right-panel" class="panel panel-right"></aside>
      </main>

      <footer id="app-footer" class="app-footer"></footer>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="

    <script type="module" src="src/core/app.js"></script>

</html>
